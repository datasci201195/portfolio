<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 124" width="120" height="124" role="img" aria-labelledby="retriever-title">
  <title id="retriever-title">Golden retriever wearing burgundy glasses</title>
  <style>
    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      svg:hover .retriever-gaze { animation: retriever-glance 1.15s ease-in-out 1; }
      svg:hover .retriever-glasses { animation: retriever-nudge 1.15s ease-in-out 1; }
    }
    @keyframes retriever-glance {
      0%, 100% { transform: translateY(0); }
      25%, 64% { transform: translateY(-1.8px); }
    }
    @keyframes retriever-nudge {
      0%, 100% { transform: translateY(0); }
      28%, 58% { transform: translateY(2px); }
    }
  </style>
  <g stroke="#533b30" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
    <!-- A small chest and the far ear give the head its three-quarter silhouette. -->
    <path fill="#d5994f" d="M39 81c-1 12-6 19-13 27l8-2-3 7c10-4 17 6 35 6 12 0 24-5 29-12l-6-1 5-2c-7-3-15-16-17-26z"/>
    <path fill="#f1ce91" stroke="none" d="M40 86c0 7-5 15-8 19l10-3-3 9 10-5-1 8 8-5 2 7 7-6 4 4c7-8 9-15 10-23z"/>
    <path fill="#c18641" d="M36 22c-11-3-18 3-22 16l-5 16c-2 9 1 16 6 17 8 1 16-12 20-26z"/>
    <path fill="#e5b263" d="M27 33c4-10 11-16 22-19l-3-3c5-1 10 0 13 2l1-6 5 6 3-4 3 5c18 0 29 16 28 35l-2 13c2 6 1 11-1 15l-3-4c-1 14-11 27-25 30l-1-4c-9 3-22 1-29-5-8-4-14-12-16-23-4-10-1-28 5-38z"/>
    <path fill="#edc486" stroke="none" d="M25 42c4-12 10-18 19-20-5 5-7 13-8 23zm20 38c3 9 7 15 16 18-11 0-20-5-23-10z"/>
    <path fill="#c8904c" stroke="none" d="M69 87c9-8 13-19 13-32l11 6c-1 19-7 31-21 37l1-5-11 4z"/>
    <!-- The near ear falls forward over the cheek. -->
    <path fill="#cc924b" d="M81 23c8-2 15 2 20 9 5 7 6 16 9 24 3 8 5 12 1 18-3 6-11 10-17 8-7-2-9-10-10-19-1-10-4-21-6-27"/>
    <path fill="#dda75a" stroke="none" d="M84 27c7-2 15 4 16 13 1 12 8 24 6 29-1 4-5 7-8 7-8-2-8-14-9-25z"/>
    <path fill="none" stroke="#946137" stroke-width="1.4" d="M102 67c1 5-1 9-4 11m9-8c0 2-1 4-3 6"/>
    <path fill="#f4d69d" stroke="none" d="M34 62c2-6 7-10 14-8 4 1 5 6 9 9 5 4 13 4 16 10 4 9-3 19-13 21-8 2-18-1-23-5-7-1-13-6-14-14-1-7 4-11 11-13z"/>
    <path fill="none" stroke="#865832" stroke-width="2.1" d="M26 41c3-4 6-5 10-4m20 1c4-3 9-2 12 0"/>
    <g class="retriever-gaze" fill="#412e2b" stroke="none">
      <ellipse cx="31" cy="52" rx="3" ry="3.8"/>
      <ellipse cx="61.4" cy="51.8" rx="3.8" ry="4.2"/>
      <g fill="#fff4de">
        <circle cx="30.2" cy="50.8" r=".95"/>
        <circle cx="60.4" cy="50.5" r="1.1"/>
      </g>
    </g>
    <path fill="#463432" d="M29 66c2-2 11-3 14-1 2 2 0 6-5 10-2 1-7-2-10-5-1-2-1-3 1-4z"/>
    <path fill="#887264" stroke="none" d="M30 66.7c3-1.5 7-1.5 10-1.2-2.2 2.1-7.2 2.4-10 1.2z"/>
    <path fill="none" d="M37 75c0 5-3 8-8 8m8-4c5 7 12 7 19 2"/>
    <g fill="#976e44" stroke="none">
      <circle cx="48.5" cy="74" r="1"/><circle cx="53" cy="74.8" r=".85"/><circle cx="51" cy="78" r=".8"/>
    </g>
    <g class="retriever-glasses" fill="none" stroke="#762e46" stroke-width="3.5">
      <path d="M14 49l6 2m20-2c3-3 6-3 10 0m25-3 11-6"/>
      <path d="M19 46c5-3 15-4 21 0 2 4 1 11-3 15-3 3-11 4-15 0-4-4-5-10-3-15zm31-1c6-3 18-4 24-1 3 4 1 12-3 16s-13 5-18 1c-4-4-5-11-3-16z"/>
    </g>
  </g>
</svg>
